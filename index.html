
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>COUNTY LITERATURE</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<header class="site-header">

    <div class="header-left">
        <h1>COUNTY LITERATURE</h1>
        <p>A SHARED MATERIAL LIBRARY</p>
    </div>

</header>


<main class="main-layout">


    <!-- =====================================
         MATERIAL LIBRARY
    ====================================== -->

    <section class="library">

        <div class="library-header">

            <div>
                <h2>MATERIAL LIBRARY</h2>
                <p>COLLECT · CLASSIFY · REUSE</p>
            </div>


            <div class="upload-area">

                <select id="uploadCategory">
                    <option value="people">PEOPLE</option>
                    <option value="objects">OBJECTS</option>
                    <option value="buildings">BUILDINGS</option>
                </select>


                <!-- Camera -->

                <input
                    type="file"
                    id="cameraInput"
                    accept="image/*"
                    capture="environment"
                    hidden
                >


                <!-- Album -->

                <input
                    type="file"
                    id="albumInput"
                    accept="image/*"
                    hidden
                >


                <button
                    id="takePhotoBtn"
                    type="button"
                >
                    + TAKE PHOTO
                </button>


                <button
                    id="fromAlbumBtn"
                    type="button"
                >
                    + FROM ALBUM
                </button>

            </div>

        </div>



        <!-- =====================================
             PEOPLE
        ====================================== -->

        <section
            class="material-category"
            data-category="people"
        >

            <div class="category-title">
                <span>PEOPLE</span>
            </div>


            <div
                class="material-grid"
                id="peopleMaterials"
            >


                <!-- PEOPLE 01 -->

                <div
                    class="material-card static-material"
                    data-static-id="people-01"
                >

                    <img
                        src="images/person01.png"
                        alt="People 01"
                        draggable="false"
                    >


                    <div class="material-menu">

                        <select class="material-category-select">

                            <option
                                value="people"
                                selected
                            >
                                PEOPLE
                            </option>

                            <option value="objects">
                                OBJECTS
                            </option>

                            <option value="buildings">
                                BUILDINGS
                            </option>

                        </select>


                        <button
                            type="button"
                            class="material-delete"
                        >
                            DELETE
                        </button>

                    </div>

                </div>

    ====================================== -->

    <section class="canvas-section">

        <div class="canvas-header">

            <div>
                <h2>CANVAS</h2>
                <p>COMPOSE YOUR COUNTY</p>
            </div>


            <div class="canvas-actions">
                <button
                    id="makeAnotherCountyBtn"
                    type="button"
                >
                    MAKE ANOTHER COUNTY
                </button>

                <button
                    id="clearCanvasBtn"
                    type="button"
                >
                    CLEAR
                </button>
            </div>

        </div>


        <div
            id="canvas"
            class="canvas"
        >

            <!-- Canvas elements will be inserted here -->

        </div>

    </section>

</main>
